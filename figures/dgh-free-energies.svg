0" cy="112.0" r="7" stroke="#214fc5" fill="#214fc5" stroke-width="1.2"/><text x="300.0" y="115.5" font-size="10" fill="#fff" text-anchor="middle" font-weight="700">+</text><circle cx="300.0" cy="106.0" r="7" stroke="#214fc5" fill="#214fc5" stroke-width="1.2"/><text x="300.0" y="109.5" font-size="10" fill="#fff" text-anchor="middle" font-weight="700">+</text><circle cx="300.0" cy="100.0" r="7" stroke="#214fc5" fill="#214fc5" stroke-width="1.2"/><text x="300.0" y="103.5" font-size="10" fill="#fff" text-anchor="middle" font-weight="700">+</text><circle cx="300.0" cy="94.0" r="7" stroke="#214fc5" fill="#214fc5" stroke-width="1.2"/><text x="300.0" y="97.5" font-size="10" fill="#fff" text-anchor="middle" font-weight="700">+</text><circle cx="300.0" cy="88.0" r="7" stroke="#b95128" fill="#fbe9dd" stroke-width="1.2"/><text x="300.0" y="91.5" font-size="10" fill="#b95128" text-anchor="middle" font-weight="700">−</text><circle cx="300.0" cy="82.0" r="7" stroke="#b95128" fill="#fbe9dd" stroke-width="1.2"/><text x="300.0" y="85.5" font-size="10" fill="#b95128" text-anchor="middle" font-weight="700">−</text><circle cx="300.0" cy="76.0" r="7" stroke="#b95128" fill="#fbe9dd" stroke-width="1.2"/><text x="300.0" y="79.5" font-size="10" fill="#b95128" text-anchor="middle" font-weight="700">−</text><circle cx="300.0" cy="70.0" r="7" stroke="#b95128" fill="#fbe9dd" stroke-width="1.2"/><text x="300.0" y="73.5" font-size="10" fill="#b95128" text-anchor="middle" font-weight="700">−</text><circle cx="300.0" cy="64.0" r="7" stroke="#b95128" fill="#fbe9dd" stroke-width="1.2"/><text x="300.0" y="67.5" font-size="10" fill="#b95128" text-anchor="middle" font-weight="700">−</text><text x="322.0" y="80.0" font-size="10.5" fill="#5b6a70" text-anchor="start">all on one site:</text><text x="322.0" y="94.0" font-size="10.5" fill="#5b6a70" text-anchor="start">the + and −</text><text x="322.0" y="108.0" font-size="10.5" fill="#5b6a70" text-anchor="start">cancel out</text><text x="18.0" y="150.0" font-size="10.5" fill="#192a31" text-anchor="start">Two monomers on the same site interact: +·+ or −·− repel (+1),</text><text x="18.0" y="165.0" font-size="10.5" fill="#192a31" text-anchor="start">+·− attract (−1). One + block, then one − block: spread out, or collapse?</text><rect x="14.0" y="182.0" width="420.0" height="82.0" rx="5" stroke="#192a31" fill="#fffefa" stroke-width="1"/><text x="24.0" y="202.0" font-size="10.5" fill="#192a31" text-anchor="start" font-weight="600">Argument of DGH (1992), made rigorous by result 4:</text><text x="24.0" y="220.0" font-size="10.5" fill="#192a31" text-anchor="start">extended: F(β), solving Σ e^(−βℓ(ℓ−1)/2 − Fℓ) = 1;</text><text x="24.0" y="236.0" font-size="10.5" fill="#192a31" text-anchor="start">collapsed: β/2 per monomer. Equality ⇔</text><text x="24.0" y="254.0" font-size="11.5" fill="#214fc5" text-anchor="start" font-weight="700">Σℓ≥1 e^(−βℓ²/2) = 1, i.e. β_c = 0.698131700799…</text><circle cx="468" cy="14" r="8" fill="#192a31"/><text x="468.0" y="18.0" font-size="10" fill="#fff" text-anchor="middle" font-weight="600">2</text><text x="482.0" y="18.0" font-size="12.5" fill="#192a31" text-anchor="start" font-weight="600">Which one wins?</text><line x1="480.0" y1="240.0" x2="738.9" y2="240.0" stroke="#192a31" stroke-width="1" marker-end="url(#dgA)"/><line x1="480.0" y1="240.0" x2="480.0" y2="35.0" stroke="#192a31" stroke-width="1" marker-end="url(#dgA)"/><text x="569.3" y="255.0" font-size="10" fill="#5b6a70" text-anchor="middle">0.5</text><text x="658.6" y="255.0" font-size="10" fill="#5b6a70" text-anchor="middle">1</text><text x="475.0" y="194.0" font-size="10" fill="#5b6a70" text-anchor="end">0.2</text><text x="475.0" y="144.0" font-size="10" fill="#5b6a70" text-anchor="end">0.4</text><text x="475.0" y="94.0" font-size="10" fill="#5b6a70" text-anchor="end">0.6</text><path d="M483.6 71.5 L487.1 75.8 L490.7 79.8 L494.3 83.6 L497.9 87.1 L501.4 90.5 L505.0 93.7 L508.6 96.8 L512.1 99.8 L515.7 102.6 L519.3 105.4 L522.9 108.0 L526