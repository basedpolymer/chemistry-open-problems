<svg xmlns="http://www.w3.org/2000/svg" width="760" height="240" font-family="DM Sans, Helvetica Neue, Helvetica, Arial, sans-serif" viewBox="0 0 760 240" role="img" aria-label="Iosif’s dual is the reverse dual of Petri nets: swap species and reactions and reverse the arrows" font-size="12" fill="none" stroke-linecap="round" stroke-linejoin="round"><rect x="0.5" y="0.5" width="759.0" height="239.0" rx="8" fill="#fffefa" stroke="#dcded7"/><defs><marker id="duA" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#192a31"/></marker><marker id="duB" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#214fc5"/></marker></defs><text x="20.0" y="22.0" font-size="11.5" fill="#192a31" text-anchor="start" font-weight="600">Network X₁ → X₂ → X₃ → X₁ (as a Petri net)</text><line x1="163.0" y1="65.5" x2="190.7" y2="81.5" stroke="#192a31" stroke-width="1.2" marker-end="url(#duA)"/><line x1="203.7" y1="104.0" x2="203.7" y2="136.0" stroke="#192a31" stroke-width="1.2" marker-end="url(#duA)"/><line x1="190.7" y1="158.5" x2="163.0" y2="174.5" stroke="#192a31" stroke-width="1.2" marker-end="url(#duA)"/><line x1="137.0" y1="174.5" x2="109.3" y2="158.5" stroke="#192a31" stroke-width="1.2" marker-end="url(#duA)"/><line x1="96.3" y1="136.0" x2="96.3" y2="104.0" stroke="#192a31" stroke-width="1.2" marker-end="url(#duA)"/><line x1="109.3" y1="81.5" x2="137.0" y2="65.5" stroke="#192a31" stroke-width="1.2" marker-end="url(#duA)"/><circle cx="150.0" cy="58.0" r="14" stroke="#214fc5" fill="#fffefa" stroke-width="1.5"/><text x="150.0" y="62.0" font-size="10.5" fill="#192a31" text-anchor="middle" font-weight="600">X₁</text><circle cx="203.7" cy="151.0" r="14" stroke="#214fc5" fill="#fffefa" stroke-width="1.5"/><text x="203.7" y="155.0" font-size="10.5" fill="#192a31" text-anchor="middle" font-weight="600">X₂</text><circle cx="96.3" cy="151.0" r="14" stroke="#214fc5" fill="#fffefa" stroke-width="1.5"/><text x="96.3" y="155.0" font-size="10.5" fill="#192a31" text-anchor="middle" font-weight="600">X₃</text><rect x="191.7" y="77.0" width="24.0" height="24.0" rx="2" stroke="#192a31" fill="#192a31" stroke-width="1"/><text x="203.7" y="93.0" font-size="10" fill="#fff" text-anchor="middle" font-weight="600">r₁</text><rect x="138.0" y="170.0" width="24.0" height="24.0" rx="2" stroke="#192a31" fill="#192a31" stroke-width="1"/><text x="150.0" y="186.0" font-size="10" fill="#fff" text-anchor="middle" font-weight="600">r₂</text><rect x="84.3" y="77.0" width="24.0" height="24.0" rx="2" stroke="#192a31" fill="#192a31" stroke-width="1"/><text x="96.3" y="93.0" font-size="10" fill="#fff" text-anchor="middle" font-weight="600">r₃</text><line x1="300.0" y1="120.0" x2="440.0" y2="120.0" stroke="#214fc5" stroke-width="2" marker-end="url(#duB)"/><text x="370.0" y="100.0" font-size="11.5" fill="#214fc5" text-anchor="middle" font-weight="700">reverse dual</text><text x="370.0" y="142.0" font-size="10.5" fill="#5b6a70" text-anchor="middle">species ↔ reactions</text><text x="370.0" y="157.0" font-size="10.5" fill="#5b6a70" text-anchor="middle">arrows reversed</text><text x="470.0" y="22.0" font-size="11.5" fill="#192a31" text-anchor="start" font-weight="600">Dual: the reactions become the species</text><line x1="613.0" y1="65.5" x2="640.7" y2="81.5" stroke="#192a31" stroke-width="1.2" marker-end="url(#duA)"/><line x1="653.7" y1="104.0" x2="653.7" y2="136.0" stroke="#192a31" stroke-width="1.2" marker-end="url(#duA)"/><line x1="640.7" y1="158.5" x2="613.0" y2="174.5" stroke="#192a31" stroke-width="1.2" marker-end="url(#duA)"/><line x1="587.0" y1="174.5" x2="559.3" y2="158.5" stroke="#192a31" stroke-width="1.2" marker-end="url(#duA)"/><line x1="546.3" y1="136.0" x2="546.3" y2="104.0" stroke="#192a31" stroke-width="1.2" marker-end="url(#duA)"/><line x1="559.3" y1="81.5" x2="587.0" y2="65.5" stroke="#192a31" stroke-width="1.2" marker-end="url(#duA)"/><circle cx="600.0" cy="58.0" r="14" stroke="#214fc5" fill="#fffefa" stroke-width="1.5"/><text x="600.0" y="62.0" font-size="10.5" fill="#192a31" text-anchor="middle" font-weight="600">r₁</text><circle cx="653.7" cy="151.0" r="14" stroke="#214fc5" fill="#fffefa" stroke-width="1.5"/><text x="653.7" y="155.0" font-size="10.5" fill="#192a31" text-anchor="middle" font-weight="600">r₃</text><circle cx="546.3" cy="151.0" r="14" stroke="#214fc5" fill="#fffefa" stroke-width="1.5"/><text x="546.3" y="155.0" font-size="10.5" fill="#192a31" text-anchor="middle" font-weight="600">r₂</text><rect x="641.7" y="77.0" width="24.0" height="24.0" rx="2" stroke="#b95128" fill="#b95128" stroke-width="1"/><text x="653.7" y="93.0" font-size="10" fill="#fff" text-anchor="middle" font-weight="600">X₁</text><rect x="588.0" y="170.0" width="24.0" height="24.0" rx="2" stroke="#b95128" fill="#b95128" stroke-width="1"/><text x="600.0" y="186.0" font-size="10" fill="#fff" text-anchor="middle" font-weight="600">X₃</text><rect x="534.3" y="77.0" width="24.0" height="24.0" rx="2" stroke="#b95128" fill="#b95128" stroke-width="1"/><text x="546.3" y="93.0" font-size="10" fill="#fff" text-anchor="middle" font-weight="600">X₂</text><text x="20.0" y="216.0" font-size="10.5" fill="#5b6a70" text-anchor="start">Circle: species. Square: reaction. Here the dual is again a 3-cycle, run backwards;</text><text x="20.0" y="231.0" font-size="10.5" fill="#5b6a70" text-anchor="start">for other networks it loses weak reversibility, persistence or convergence.</text></svg>