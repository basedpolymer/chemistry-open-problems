ₙ (total monomers)</text><text x="533.0" y="70.0" font-size="11" fill="#192a31" text-anchor="start">It is conserved… unless an “infinite”</text><text x="533.0" y="86.0" font-size="11" fill="#192a31" text-anchor="start">cluster (the gel) swallows it.</text><line x1="40.0" y1="236.0" x2="728.0" y2="236.0" stroke="#192a31" stroke-width="1.2" marker-end="url(#cgA)"/><text x="728.0" y="254.0" font-size="11" fill="#5b6a70" text-anchor="end" font-style="italic">m</text><line x1="40.0" y1="231.0" x2="40.0" y2="241.0" stroke="#192a31" stroke-width="1.2"/><text x="40.0" y="256.0" font-size="10.5" fill="#5b6a70" text-anchor="middle">0</text><line x1="252.5" y1="231.0" x2="252.5" y2="241.0" stroke="#192a31" stroke-width="1.2"/><text x="252.5" y="256.0" font-size="10.5" fill="#5b6a70" text-anchor="middle">1/2</text><line x1="465.0" y1="231.0" x2="465.0" y2="241.0" stroke="#192a31" stroke-width="1.2"/><text x="465.0" y="256.0" font-size="10.5" fill="#5b6a70" text-anchor="middle">1</text><line x1="677.5" y1="231.0" x2="677.5" y2="241.0" stroke="#192a31" stroke-width="1.2"/><text x="677.5" y="256.0" font-size="10.5" fill="#5b6a70" text-anchor="middle">1,5</text><rect x="41.0" y="196.0" width="210.5" height="24.0" rx="3" stroke="#8e9794" fill="#ecece6" stroke-width="1"/><text x="146.2" y="212.0" font-size="10" fill="#192a31" text-anchor="middle">Jang–Tran 2025 (with 2nd moment)</text><rect x="41.0" y="164.0" width="423.0" height="26.0" rx="3" stroke="#214fc5" fill="#e4ebfb" stroke-width="1.3"/><text x="252.5" y="181.0" font-size="10.5" fill="#214fc5" text-anchor="middle" font-weight="700">result 11: unique global mass-conserving solution, no 2nd moment needed</text><rect x="253.5" y="196.0" width="210.5" height="24.0" rx="3" stroke="#214fc5" fill="#fff" stroke-width="1" stroke-dasharray="4 3"/><text x="358.8" y="212.0" font-size="10" fill="#214fc5" text-anchor="middle">conjecture 2: 1/2 ≤ m &lt; 1</text><rect x="466.0" y="196.0" width="253.0" height="24.0" rx="3" stroke="#b95128" fill="#fbe9dd" stroke-width="1"/><text x="592.5" y="212.0" font-size="10" fill="#b95128" text-anchor="middle">gelation: mass not conserved (JT, Thm 1.1)</text><text x="465.0" y="274.0" font-size="10.5" fill="#192a31" text-anchor="middle" font-weight="600">m = 1: critical mass, covered (mass stays 1, each ρₙ → 0)</text><text x="40.0" y="298.0" font-size="10.5" fill="#5b6a70" text-anchor="start">For 0 &lt; m &lt; 1: a unique steady state ρ̃ₙ ≈ b·R⁻ⁿ·n^(−5/2) (R > 1), which attracts every solution.</text></svg>