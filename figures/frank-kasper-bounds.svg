<svg xmlns="http://www.w3.org/2000/svg" width="760" height="200" font-family="DM Sans, Helvetica Neue, Helvetica, Arial, sans-serif" viewBox="0 0 760 200" role="img" aria-label="Frank–Kasper: the proved lower bound is far below the energy of sigma, while competitors are within 0.022 %; hence the question stays open" font-size="12" fill="none" stroke-linecap="round" stroke-linejoin="round"><rect x="0.5" y="0.5" width="759.0" height="199.0" rx="8" fill="#fffefa" stroke="#dcded7"/><defs><marker id="fkA" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#192a31"/></marker></defs><text x="40.0" y="22.0" font-size="12" fill="#192a31" text-anchor="start" font-weight="600">Normalized energy 𝓕 of the diblock foam model (lower = more stable)</text><rect x="82.5" y="58.0" width="561.0" height="16.0" rx="3" stroke="#8e9794" fill="#ecece6" stroke-width="0.8"/><text x="363.0" y="70.0" font-size="10.5" fill="#192a31" text-anchor="middle">ceiling of the current lower-bound method: &lt; 1.066</text><line x1="40.0" y1="90.0" x2="728.0" y2="90.0" stroke="#192a31" stroke-width="1.2" marker-end="url(#fkA)"/><line x1="82.5" y1="86.0" x2="82.5" y2="94.0" stroke="#192a31" stroke-width="1"/><text x="82.5" y="108.0" font-size="10" fill="#5b6a70" text-anchor="middle">1.00</text><line x1="252.5" y1="86.0" x2="252.5" y2="94.0" stroke="#192a31" stroke-width="1"/><text x="252.5" y="108.0" font-size="10" fill="#5b6a70" text-anchor="middle">1.02</text><line x1="422.5" y1="86.0" x2="422.5" y2="94.0" stroke="#192a31" stroke-width="1"/><text x="422.5" y="108.0" font-size="10" fill="#5b6a70" text-anchor="middle">1.04</text><line x1="592.5" y1="86.0" x2="592.5" y2="94.0" stroke="#192a31" stroke-width="1"/><text x="592.5" y="108.0" font-size="10" fill="#5b6a70" text-anchor="middle">1.06</text><line x1="82.5" y1="80.0" x2="82.5" y2="100.0" stroke="#214fc5" stroke-width="2.2"/><text x="82.5" y="126.0" font-size="10.5" fill="#214fc5" text-anchor="middle" font-weight="600">proved lower bound</text><text x="82.5" y="140.0" font-size="10.5" fill="#214fc5" text-anchor="middle">1,00000025</text><line x1="665.4" y1="80.0" x2="665.4" y2="100.0" stroke="#b95128" stroke-width="2.2"/><text x="665.4" y="126.0" font-size="10.5" fill="#b95128" text-anchor="middle" font-weight="600">σ: 1.068576</text><text x="665.4" y="140.0" font-size="10" fill="#b95128" text-anchor="middle">(certified witness)</text><text x="40.0" y="170.0" font-size="10.5" fill="#5b6a70" text-anchor="start">The best competitors are ≈ 0.022 % above σ in the numerical screen: one would need lower bounds</text><text x="40.0" y="185.0" font-size="10.5" fill="#5b6a70" text-anchor="start">accurate to 10⁻⁴ for each topology; the proved global bound is ≈ 7 % lower.</text></svg>