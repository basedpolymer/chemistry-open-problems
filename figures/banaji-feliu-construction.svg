<svg xmlns="http://www.w3.org/2000/svg" width="760" height="330" font-family="DM Sans, Helvetica Neue, Helvetica, Arial, sans-serif" viewBox="0 0 760 330" role="img" aria-label="Result 1, case n = 3: the steady states lie on a monomial curve and match the three positive roots of a polynomial" font-size="12" fill="none" stroke-linecap="round" stroke-linejoin="round"><rect x="0.5" y="0.5" width="759.0" height="329.0" rx="8" fill="#fffefa" stroke="#dcded7"/><defs><marker id="sA" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#192a31"/></marker></defs><circle cx="18" cy="14" r="8" fill="#192a31"/><text x="18.0" y="18.0" font-size="10" fill="#fff" text-anchor="middle" font-weight="600">1</text><text x="32.0" y="18.0" font-size="12.5" fill="#192a31" text-anchor="start" font-weight="600">The network 𝒩₃ (n = 3)</text><text x="18.0" y="48.0" font-size="11.5" fill="#192a31" text-anchor="start" xml:space="preserve">X₁ → 2X₁ + X₃        κ = 1/25</text><text x="18.0" y="68.0" font-size="11.5" fill="#192a31" text-anchor="start" xml:space="preserve">2X₁ + X₂ → X₁ + 2X₂   κ = 1/22,500</text><text x="18.0" y="88.0" font-size="11.5" fill="#192a31" text-anchor="start" xml:space="preserve">2X₂ + X₃ → X₂          κ = 1/1,296</text><text x="18.0" y="118.0" font-size="11.5" fill="#192a31" text-anchor="start" font-weight="600">Class: x₁ + x₂ − x₃ = 60</text><circle cx="18" cy="146" r="8" fill="#192a31"/><text x="18.0" y="150.0" font-size="10" fill="#fff" text-anchor="middle" font-weight="600">2</text><text x="32.0" y="150.0" font-size="12.5" fill="#192a31" text-anchor="start" font-weight="600">Steady states on one curve</text><text x="18.0" y="178.0" font-size="12" fill="#214fc5" text-anchor="start" font-weight="600">x(λ) = (25λ, 36/λ, λ³)</text><text x="18.0" y="204.0" font-size="11.5" fill="#192a31" text-anchor="start">λ = 1</text><text x="70.0" y="204.0" font-size="11.5" fill="#192a31" text-anchor="start">(25, 36, 1)</text><text x="170.0" y="204.0" font-size="11" fill="#5b6a70" text-anchor="start">stable</text><text x="18.0" y="223.0" font-size="11.5" fill="#192a31" text-anchor="start">λ = 2</text><text x="70.0" y="223.0" font-size="11.5" fill="#192a31" text-anchor="start">(50, 18, 8)</text><text x="170.0" y="223.0" font-size="11" fill="#5b6a70" text-anchor="start">saddle</text><text x="18.0" y="242.0" font-size="11.5" fill="#192a31" text-anchor="start">λ = 3</text><text x="70.0" y="242.0" font-size="11.5" fill="#192a31" text-anchor="start">(75, 12, 27)</text><text x="170.0" y="242.0" font-size="11" fill="#5b6a70" text-anchor="start">stable</text><circle cx="328" cy="14" r="8" fill="#192a31"/><text x="328.0" y="18.0" font-size="10" fill="#fff" text-anchor="middle" font-weight="600">3</text><text x="342.0" y="18.0" font-size="12.5" fill="#192a31" text-anchor="start" font-weight="600">One equation in λ</text><line x1="330.0" y1="175.4" x2="730.0" y2="175.4" stroke="#192a31" stroke-width="1" marker-end="url(#sA)"/><line x1="330.0" y1="260.0" x2="330.0" y2="40.0" stroke="#192a31" stroke-width="1"/><line x1="441.1" y1="175.4" x2="441.1" y2="179.4" stroke="#192a31" stroke-width="1"/><text x="441.1" y="205.4" font-size="10.5" fill="#5b6a70" text-anchor="middle">1</text><line x1="552.2" y1="175.4" x2="552.2" y2="179.4" stroke="#192a31" stroke-width="1"/><text x="552.2" y="205.4" font-size="10.5" fill="#5b6a70" text-anchor="middle">2</text><line x1="663.3" y1="175.4" x2="663.3" y2="179.4" stroke="#192a31" stroke-width="1"/><text x="663.3" y="205.4" font-size="10.5" fill="#5b6a70" text-anchor="middle">3</text><text x="324.0" y="247.1" font-size="10" fill="#5b6a70" text-anchor="end">-20</text><text x="324.0" y="179.4" font-size="10" fill="#5b6a70" text-anchor="end">0</text><text x="324.0" y="111.7" font-size="10" fill="#5b6a70" text-anchor="end">20</text><text x="324.0" y="44.0" font-size="10" fill="#5b6a70" text-anchor="end">40</text><path d="M332.2 57.6 L334.2 61.1 L336.2 6