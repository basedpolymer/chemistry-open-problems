<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="760" height="280" font-family="DM Sans, Helvetica Neue, Helvetica, Arial, sans-serif" viewBox="0 0 760 280" role="img" aria-label="Bistability in small bimolecular networks: the origin and a positive steady state are both stable, separated by the separatrix of a saddle" font-size="12" fill="none" stroke-linecap="round" stroke-linejoin="round"><rect x="0.5" y="0.5" width="759.0" height="279.0" rx="8" fill="#fffefa" stroke="#dcded7"/><defs><marker id="bA" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#192a31"/></marker><marker id="bB" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#214fc5"/></marker></defs><line x1="50.0" y1="250.0" x2="350.0" y2="250.0" stroke="#192a31" stroke-width="1.2" marker-end="url(#bA)"/><line x1="50.0" y1="250.0" x2="50.0" y2="20.0" stroke="#192a31" stroke-width="1.2" marker-end="url(#bA)"/><text x="350.0" y="266.0" font-size="11" fill="#5b6a70" text-anchor="end" font-style="italic">x</text><text x="42.0" y="28.0" font-size="11" fill="#5b6a70" text-anchor="end" font-style="italic">y</text><path d="M70 35 C120 110 145 140 170 155 C200 173 250 220 340 242" stroke="#b95128" stroke-width="1.5" stroke-dasharray="6 4"/><path d="M50 250 L70 35 C120 110 145 140 170 155 C200 173 250 220 340 242 L340 250 Z" fill="#fbe9dd" opacity=".45"/><path d="M110.0 220.0 L80.0 236.0 L58.0 247.0" stroke="#192a31" stroke-width="1.1" fill="none" marker-end="url(#bA)"/><path d="M200.0 225.0 L140.0 238.0 L70.0 248.0" stroke="#192a31" stroke-width="1.1" fill="none" marker-end="url(#bA)"/><path d="M320.0 130.0 L300.0 100.0 L286.0 85.0" stroke="#214fc5" stroke-width="1.1" fill="none" marker-end="url(#bB)"/><path d="M210.0 60.0 L250.0 75.0 L274.0 76.0" stroke="#214fc5" stroke-width="1.1" fill="none" marker-end="url(#bB)"/><circle cx="50.0" cy="250.0" r="5" stroke="#192a31" fill="#192a31" stroke-width="1.2"/><circle cx="170.0" cy="155.0" r="5" stroke="#192a31" fill="#fff" stroke-width="1.5"/><circle cx="280.0" cy="80.0" r="5" stroke="#214fc5" fill="#214fc5" stroke-width="1.2"/><text x="58.0" y="266.0" font-size="10.5" fill="#192a31" text-anchor="start">stable origin</text><text x="180.0" y="147.0" font-size="10.5" fill="#192a31" text-anchor="start">saddle</text><text x="272.0" y="70.0" font-size="10.5" fill="#214fc5" text-anchor="end">stable positive steady state</text><text x="170.0" y="210.0" font-size="10" fill="#b95128" text-anchor="middle">basin of extinction</text><text x="400.0" y="40.0" font-size="12.5" fill="#192a31" text-anchor="start" font-weight="600">The only possible bistability</text><text x="400.0" y="64.0" font-size="11" fill="#192a31" text-anchor="start" xml:space="preserve">Among all 27,195 networks (2 species, 4 reactions,</text><text x="400.0" y="80.0" font-size="11" fill="#192a31" text-anchor="start" xml:space="preserve">complexes of at most 2 molecules):</text><text x="400.0" y="96.0" font-size="11" fill="#192a31" text-anchor="start" xml:space="preserve">• at most two stable steady states;</text><text x="400.0" y="112.0" font-size="11" fill="#192a31" text-anchor="start" xml:space="preserve">• two positive steady states are never</text><text x="400.0" y="128.0" font-size="11" fill="#192a31" text-anchor="start" xml:space="preserve">  stable together;</text><text x="400.0" y="144.0" font-size="11" fill="#192a31" text-anchor="start" xml:space="preserve">• when two coexist: the origin (extinction)</text><text x="400.0" y="160.0" font-size="11" fill="#192a31" text-anchor="start" xml:space="preserve">  and a positive one, separated by a saddle.</text><text x="400.0" y="176.0" font-size="11" fill="#192a31" text-anchor="start" xml:space="preserve"></text><text x="400.0" y="192.0" font-size="11" fill="#214fc5" text-anchor="start" xml:space="preserve">Key: an index theorem. If the origin is</text><text x="400.0" y="208.0" font-size="11" fill="#214fc5" text-anchor="start" xml:space="preserve">stable, the indices of the positive steady</text><text x="400.0" y="224.0" font-size="11" fill="#214fc5" text-anchor="start" xml:space="preserve">states sum to ≤ 0, so a saddle is forced.</text><text x="400.0" y="240.0" font-size="11" fill="#214fc5" text-anchor="start" xml:space="preserve">That leads back to the 10 known networks.</text></svg>