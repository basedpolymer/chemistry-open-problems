<svg xmlns="http://www.w3.org/2000/svg" width="760" height="282" font-family="DM Sans, Helvetica Neue, Helvetica, Arial, sans-serif" viewBox="0 0 760 282" role="img" aria-label="Four nested limit cycles around a stable focus, alternately unstable and stable, bracketed by five certified sign changes" font-size="12" fill="none" stroke-linecap="round" stroke-linejoin="round"><rect x="0.5" y="0.5" width="759.0" height="281.0" rx="8" fill="#fffefa" stroke="#dcded7"/><defs><marker id="fA" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#192a31"/></marker><marker id="fB" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#214fc5"/></marker><marker id="fO" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#b95128"/></marker></defs><circle cx="140.0" cy="140.0" r="28" stroke="#b95128" fill="none" stroke-width="1.6" stroke-dasharray="6 4"/><text x="164.2" y="117.8" font-size="11" fill="#b95128" text-anchor="start" font-weight="700">Γ0</text><circle cx="140.0" cy="140.0" r="54" stroke="#214fc5" fill="none" stroke-width="2"/><text x="182.9" y="99.1" font-size="11" fill="#214fc5" text-anchor="start" font-weight="700">Γ1</text><circle cx="140.0" cy="140.0" r="80" stroke="#b95128" fill="none" stroke-width="1.6" stroke-dasharray="6 4"/><text x="201.6" y="80.4" font-size="11" fill="#b95128" text-anchor="start" font-weight="700">Γ2</text><circle cx="140.0" cy="140.0" r="108" stroke="#214fc5" fill="none" stroke-width="2"/><text x="221.8" y="60.2" font-size="11" fill="#214fc5" text-anchor="start" font-weight="700">Γ3</text><circle cx="140.0" cy="140.0" r="4" stroke="#192a31" fill="#192a31" stroke-width="1.2"/><text x="140.0" y="160.0" font-size="10" fill="#5b6a70" text-anchor="middle">stable</text><text x="140.0" y="172.0" font-size="10" fill="#5b6a70" text-anchor="middle">focus</text><text x="10.0" y="272.0" font-size="10.5" fill="#5b6a70" text-anchor="start">Not to scale. Γ₀, Γ₂ unstable; Γ₁, Γ₃ stable.</text><text x="300.0" y="30.0" font-size="12" fill="#192a31" text-anchor="start" font-weight="600">Theorem C: sign of the displacement δ(ρ) after one turn</text><text x="300.0" y="47.0" font-size="10.5" fill="#5b6a70" text-anchor="start">(validated integration in ball arithmetic, explicit parameters)</text><line x1="295.0" y1="120.0" x2="735.0" y2="120.0" stroke="#192a31" stroke-width="1.2" marker-end="url(#fA)"/><text x="730.0" y="152.0" font-size="10.5" fill="#5b6a70" text-anchor="end">ρ (log scale)</text><line x1="354.1" y1="114.0" x2="354.1" y2="126.0" stroke="#192a31" stroke-width="1.4"/><text x="354.1" y="142.0" font-size="10" fill="#5b6a70" text-anchor="middle">0.002</text><circle cx="354.1" cy="92.0" r="11" stroke="#b95128" fill="#fff" stroke-width="1.4"/><text x="354.1" y="96.5" font-size="14" fill="#b95128" text-anchor="middle" font-weight="700">−</text><line x1="352.1" y1="70.0" x2="332.1" y2="70.0" stroke="#b95128" stroke-width="1.3" marker-end="url(#fO)"/><line x1="441.0" y1="114.0" x2="441.0" y2="126.0" stroke="#192a31" stroke-width="1.4"/><text x="441.0" y="142.0" font-size="10" fill="#5b6a70" text-anchor="middle">0.004</text><circle cx="441.0" cy="92.0" r="11" stroke="#214fc5" fill="#fff" stroke-width="1.4"/><text x="441.0" y="96.5" font-size="14" fill="#214fc5" text-anchor="middle" font-weight="700">+</text><line x1="443.0" y1="70.0" x2="463.0" y2="70.0" stroke="#214fc5" stroke-width="1.3" marker-end="url(#fB)"/><line x1="491.9" y1="114.0" x2="491.9" y2="126.0" stroke="#192a31" stroke-width="1.4"/><text x="491.9" y="142.0" font-size="10" fill="#5b6a70" text-anchor="middle">0.006</text><circle cx="491.9" cy="92.0" r="11" stroke="#b95128" fill="#fff" stroke-width="1.4"/><text x="491.9" y="96.5" font-size="14" fill="#b95128" text-anchor="middle" font-weight="700">−</text><line x1="489.9" y1="70.0" x2="469.9" y2="70.0" stroke="#b95128" stroke-width="1.3" marker-end="url(#fO)"/><line x1="578.9" y1="114.0" x2="578.9" y2="126.0" stroke="#192a31" stroke-width="1.4"/><text x="578.9" y="142.0" font-size="10" fill="#5b6a70" text-anchor="middle">0.012</text><circle cx="578.9" cy="92.0" r="11" stroke="#214fc5" fill="#fff" stroke-width="1.4"/><text x="578.9" y="96.5" font-size="14" fill="#214fc5" text-anchor="middle" font-weight="700">+</text><line x1="580.9" y1="70.0" x2="600.9" y2="70.0" stroke="#214fc5" stroke-width="1.3" marker-end="url(#fB)"/><line x1="665.9" y1="114.0" x2="665.9" y2="126.0" stroke="#192a31" stroke-width="1.4"/><text x="665.9" y="142.0" font-size="10" fill="#5b6a70" text-anchor="middle">0.024</text><circle cx="665.9" cy="92.0" r="11" stroke="#b95128" fill="#fff" stroke-width="1.4"/><text x="665.9" y="96.5" font-size="14" fill="#b95128" text-anchor="middle" font-weight="700">−</text><line x1="663.9" y1="70.0" x2="643.9" y2="70.0" stroke="#b95128" stroke-width="1.3" marker-end="url(#fO)"/><path d="M358.1 160.0 L358.1 166.0 L437.0 166.0 L437.0 160.0" stroke="#b95128" stroke-width="1.3" fill="none"/><text x="397.6" y="182.0" font-size="11.5" fill="#b95128" text-anchor="middle" font-weight="700">Γ0</text><text x="397.6" y="196.0" font-size="10" fill="#b95128" text-anchor="middle">unstable</text><path d="M445.0 160.0 L445.0 166.0 L487.9 166.0 L487.9 160.0" stroke="#214fc5" stroke-width="1.3" fill="none"/><text x="466.5" y="182.0" font-size="11.5" fill="#214fc5" text-anchor="middle" font-weight="700">Γ1</text><text x="466.5" y="196.0" font-size="10" fill="#214fc5" text-anchor="middle">stable</text><path d="M495.9 160.0 L495.9 166.0 L574.9 166.0 L574.9 160.0" stroke="#b95128" stroke-width="1.3" fill="none"/><text x="535.4" y="182.0" font-size="11.5" fill="#b95128" text-anchor="middle" font-weight="700">Γ2</text><text x="535.4" y="196.0" font-size="10" fill="#b95128" text-anchor="middle">unstable</text><path d="M582.9 160.0 L582.9 166.0 L661.9 166.0 L661.9 160.0" stroke="#214fc5" stroke-width="1.3" fill="none"/><text x="622.4" y="182.0" font-size="11.5" fill="#214fc5" text-anchor="middle" font-weight="700">Γ3</text><text x="622.4" y="196.0" font-size="10" fill="#214fc5" text-anchor="middle">stable</text><text x="300.0" y="224.0" font-size="10.5" fill="#5b6a70" text-anchor="start">δ &lt; 0: the trajectory comes back closer (←); δ > 0: it moves away (→).</text><text x="300.0" y="240.0" font-size="10.5" fill="#5b6a70" text-anchor="start">Each sign change traps a cycle; “+ then −” gives a stable one.</text></svg>