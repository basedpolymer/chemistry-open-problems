<svg xmlns="http://www.w3.org/2000/svg" width="760" height="336" font-family="DM Sans, Helvetica Neue, Helvetica, Arial, sans-serif" viewBox="0 0 760 336" role="img" aria-label="Heat exchangers with a split cold stream: the controller equalizes temperatures computed by a recursion; the published recursion drops a term from the third exchanger on" font-size="12" fill="none" stroke-linecap="round" stroke-linejoin="round"><rect x="0.5" y="0.5" width="759.0" height="335.0" rx="8" fill="#fffefa" stroke="#dcded7"/><defs><marker id="hA" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#192a31"/></marker><marker id="hH" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#b95128"/></marker><marker id="hD" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#5b6a70"/></marker></defs><line x1="10.0" y1="100.0" x2="70.0" y2="100.0" stroke="#192a31" stroke-width="1.5"/><text x="10.0" y="92.0" font-size="11" fill="#192a31" text-anchor="start">cold w₀</text><path d="M70.0 100.0 L90.0 60.0 L120.0 60.0" stroke="#192a31" stroke-width="1.5" fill="none" marker-end="url(#hA)"/><path d="M70.0 100.0 L90.0 150.0 L120.0 150.0" stroke="#192a31" stroke-width="1.5" fill="none" marker-end="url(#hA)"/><circle cx="70.0" cy="100.0" r="5" stroke="#192a31" fill="#fff" stroke-width="1.2"/><text x="70.0" y="128.0" font-size="10" fill="#5b6a70" text-anchor="middle">split</text><text x="102.0" y="50.0" font-size="10" fill="#5b6a70" text-anchor="middle">u·w₀</text><text x="102.0" y="168.0" font-size="10" fill="#5b6a70" text-anchor="middle">(1−u)·w₀</text><rect x="130.0" y="44.0" width="70.0" height="32.0" rx="4" stroke="#192a31" fill="#fffefa" stroke-width="1.2"/><text x="165.0" y="64.0" font-size="11.5" fill="#192a31" text-anchor="middle" font-weight="600">E1</text><line x1="165.0" y1="14.0" x2="165.0" y2="42.0" stroke="#b95128" stroke-width="1.3" marker-end="url(#hH)"/><text x="171.0" y="22.0" font-size="9.5" fill="#b95128" text-anchor="start">hot</text><line x1="200.0" y1="60.0" x2="248.0" y2="60.0" stroke="#192a31" stroke-width="1.4" marker-end="url(#hA)"/><circle cx="222.0" cy="60.0" r="7" stroke="#192a31" fill="#fff" stroke-width="1.1"/><text x="222.0" y="64.0" font-size="9" fill="#192a31" text-anchor="middle" font-weight="700">T</text><rect x="250.0" y="44.0" width="70.0" height="32.0" rx="4" stroke="#192a31" fill="#fffefa" stroke-width="1.2"/><text x="285.0" y="64.0" font-size="11.5" fill="#192a31" text-anchor="middle" font-weight="600">E2</text><line x1="285.0" y1="14.0" x2="285.0" y2="42.0" stroke="#b95128" stroke-width="1.3" marker-end="url(#hH)"/><text x="291.0" y="22.0" font-size="9.5" fill="#b95128" text-anchor="start">hot</text><line x1="320.0" y1="60.0" x2="368.0" y2="60.0" stroke="#192a31" stroke-width="1.4" marker-end="url(#hA)"/><circle cx="342.0" cy="60.0" r="7" stroke="#192a31" fill="#fff" stroke-width="1.1"/><text x="342.0" y="64.0" font-size="9" fill="#192a31" text-anchor="middle" font-weight="700">T</text><rect x="370.0" y="44.0" width="70.0" height="32.0" rx="4" stroke="#192a31" fill="#fffefa" stroke-width="1.2"/><text x="405.0" y="64.0" font-size="11.5" fill="#192a31" text-anchor="middle" font-weight="600">E3</text><line x1="405.0" y1="14.0" x2="405.0" y2="42.0" stroke="#b95128" stroke-width="1.3" marker-end="url(#hH)"/><text x="411.0" y="22.0" font-size="9.5" fill="#b95128" text-anchor="start">hot</text><circle cx="462.0" cy="60.0" r="7" stroke="#192a31" fill="#fff" stroke-width="1.1"/><text x="462.0" y="64.0" font-size="9" fill="#192a31" text-anchor="middle" font-weight="700">T</text><rect x="130.0" y="134.0" width="70.0" height="32.0" rx="4" stroke="#192a31" fill="#fffefa" stroke-width="1.2"/><text x="165.0" y="154.0" font-size="11.5" fill="#192a31" text-anchor="middle" font-weight="600">E′</text><line x1="165.0" y1="104.0" x2="165.0" y2="132.0" stroke="#b95128" stroke-width="1.3" marker-end="url(#hH)"/><circle cx="222.0" cy="150.0" r="7" stroke="#192a31" fill="#fff" stroke-width="1.1"/><text x="222.0" y="154.0" font-size="9" fill="#192a31" text-anchor="middle" font-weight="700">T</text><path d="M440.0 60.0 L500.0 60.0 L520.0 100.0" stroke="#192a31" stroke-width="1.4" fill="none"/><path d="M200.0 150.0 L500.0 150.0 L520.0 100.0" stroke="#192a31" stroke-width="1.4" fill="none"/><line x1="520.0" y1="100.0" x2="560.0" y2="100.0" stroke="#192a31" stroke-width="1.5" marker-end="url(#hA)"/><text x="565.0" y="104.0" font-size="11" fill="#192a31" text-anchor="start">outlet</text><rect x="600.0" y="120.0" width="150.0" height="54.0" rx="5" stroke="#214fc5" fill="#e4ebfb" stroke-width="1.2"/><text x="675.0" y="141.0" font-size="11" fill="#214fc5" text-anchor="middle" font-weight="600">equalize the</text><text x="675.0" y="157.0" font-size="10.5" fill="#214fc5" text-anchor="middle" font-weight="600">Jäschke temperatures</text><path d="M462.0 67.0 L462.0 110.0 L598.0 128.0" stroke="#5b6a70" stroke-width="1" fill="none" stroke-dasharray="3 3" marker-end="url(#hD)"/><path d="M222.0 157.0 L222.0 186.0 L598.0 168.0" stroke="#5b6a70" stroke-width="1" fill="none" stroke-dasharray="3 3" marker-end="url(#hD)"/><path d="M675.0 176.0 L675.0 205.0 L70.0 205.0 L70.0 107.0" stroke="#5b6a70" stroke-width="1" fill="none" stroke-dasharray="3 3" marker-end="url(#hD)"/><text x="380.0" y="199.0" font-size="10" fill="#5b6a70" text-anchor="middle">adjusts u</text><text x="10.0" y="240.0" font-size="11.5" fill="#192a31" text-anchor="start" font-weight="600">What the controller computes on the top branch (cᵢ depends only on measured temperatures):</text><text x="10.0" y="264.0" font-size="12" fill="#192a31" text-anchor="start">a₁ = c₁ (θ₁ + θ₀)</text><text x="200.0" y="264.0" font-size="12" fill="#192a31" text-anchor="start">a₂ = c₂ (θ₂ + θ₁ − a₁)</text><text x="10.0" y="292.0" font-size="11" fill="#5b6a70" text-anchor="start">paper (2014):</text><text x="120.0" y="292.0" font-size="12" fill="#192a31" text-anchor="start">a₃ = c₃ (θ₃ + θ₂ − a₂)</text><text x="10.0" y="316.0" font-size="11" fill="#5b6a70" text-anchor="start">corrected:</text><text x="120.0" y="316.0" font-size="12" fill="#192a31" text-anchor="start">a₃ = c₃ (θ₃ + θ₂ −</text><rect x="226.0" y="302.0" width="24.0" height="19.0" rx="3" stroke="#b95128" fill="#fbe9dd" stroke-width="1"/><text x="238.0" y="316.0" font-size="12" fill="#b95128" text-anchor="middle" font-weight="700">a₁</text><text x="254.0" y="316.0" font-size="12" fill="#192a31" text-anchor="start">− a₂)</text><text x="330.0" y="292.0" font-size="11" fill="#5b6a70" text-anchor="start">identical for 1 and 2 exchangers;</text><text x="330.0" y="308.0" font-size="11" fill="#5b6a70" text-anchor="start">from the 3rd on, the paper drops the sum</text><text x="330.0" y="324.0" font-size="11" fill="#5b6a70" text-anchor="start">of earlier terms (gap c₃·a₁ ≠ 0).</text></svg>