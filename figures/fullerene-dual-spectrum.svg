103.1" x2="167.6" y2="125.7" stroke="#192a31" stroke-width="1.6"/><line x1="167.6" y1="125.7" x2="132.4" y2="125.7" stroke="#192a31" stroke-width="1.6"/><line x1="150.0" y1="82.0" x2="115.9" y2="103.1" stroke="#192a31" stroke-width="1.6"/><line x1="115.9" y1="103.1" x2="85.3" y2="129.0" stroke="#192a31" stroke-width="1.6"/><line x1="85.3" y1="129.0" x2="94.8" y2="167.9" stroke="#192a31" stroke-width="1.6"/><line x1="94.8" y1="167.9" x2="110.0" y2="205.0" stroke="#192a31" stroke-width="1.6"/><line x1="110.0" y1="205.0" x2="150.0" y2="208.0" stroke="#192a31" stroke-width="1.6"/><line x1="150.0" y1="208.0" x2="190.0" y2="205.0" stroke="#192a31" stroke-width="1.6"/><line x1="190.0" y1="205.0" x2="205.2" y2="167.9" stroke="#192a31" stroke-width="1.6"/><line x1="205.2" y1="167.9" x2="214.7" y2="129.0" stroke="#192a31" stroke-width="1.6"/><line x1="214.7" y1="129.0" x2="184.1" y2="103.1" stroke="#192a31" stroke-width="1.6"/><line x1="184.1" y1="103.1" x2="150.0" y2="82.0" stroke="#192a31" stroke-width="1.6"/><circle cx="150.0" cy="45.0" r="3.2" stroke="#192a31" fill="#192a31" stroke-width="1"/><circle cx="50.1" cy="117.6" r="3.2" stroke="#192a31" fill="#192a31" stroke-width="1"/><circle cx="88.3" cy="234.9" r="3.2" stroke="#192a31" fill="#192a31" stroke-width="1"/><circle cx="211.7" cy="234.9" r="3.2" stroke="#192a31" fill="#192a31" stroke-width="1"/><circle cx="249.9" cy="117.6" r="3.2" stroke="#192a31" fill="#192a31" stroke-width="1"/><circle cx="150.0" cy="82.0" r="3.2" stroke="#192a31" fill="#192a31" stroke-width="1"/><circle cx="115.9" cy="103.1" r="3.2" stroke="#192a31" fill="#192a31" stroke-width="1"/><circle cx="85.3" cy="129.0" r="3.2" stroke="#192a31" fill="#192a31" stroke-width="1"/><circle cx="94.8" cy="167.9" r="3.2" stroke="#192a31" fill="#192a31" stroke-width="1"/><circle cx="110.0" cy="205.0" r="3.2" stroke="#192a31" fill="#192a31" stroke-width="1"/><circle cx="150.0" cy="208.0" r="3.2" stroke="#192a31" fill="#192a31" stroke-width="1"/><circle cx="190.0" cy="205.0" r="3.2" stroke="#192a31" fill="#192a31" stroke-width="1"/><circle cx="205.2" cy="167.9" r="3.2" stroke="#192a31" fill="#192a31" stroke-width="1"/><circle cx="214.7" cy="129.0" r="3.2" stroke="#192a31" fill="#192a31" stroke-width="1"/><circle cx="184.1" cy="103.1" r="3.2" stroke="#192a31" fill="#192a31" stroke-width="1"/><circle cx="132.4" cy="125.7" r="3.2" stroke="#192a31" fill="#192a31" stroke-width="1"/><circle cx="121.5" cy="159.3" r="3.2" stroke="#192a31" fill="#192a31" stroke-width="1"/><circle cx="150.0" cy="180.0" r="3.2" stroke="#192a31" fill="#192a31" stroke-width="1"/><circle cx="178.5" cy="159.3" r="3.2" stroke="#192a31" fill="#192a31" stroke-width="1"/><circle cx="167.6" cy="125.7" r="3.2" stroke="#192a31" fill="#192a31" stroke-width="1"/><circle cx="150.0" cy="150.0" r="5" stroke="#b95128" fill="#fbe9dd" stroke-width="1.6"/><circle cx="110.0" cy="137.0" r="5" stroke="#b95128" fill="#fbe9dd" stroke-width="1.6"/><circle cx="110.3" cy="95.3" r="5" stroke="#b95128" fill="#fbe9dd" stroke-width="1.6"/><circle cx="125.3" cy="184.0" r="5" stroke="#b95128" fill="#fbe9dd" stroke-width="1.6"/><circle cx="85.7" cy="170.9" r="5" stroke="#b95128" fill="#fbe9dd" stroke-width="1.6"/><circle cx="174.7" cy="184.0" r="5" stroke="#b95128" fill="#fbe9dd" stroke-width="1.6"/><circle cx="150.0" cy="217.6" r="5" stroke="#b95128" fill="#fbe9dd" stroke-width="1.6"/><circle cx="190.0" cy="137.0" r="5" stroke="#b95128" fill="#fbe9dd" stroke-width="1.6"/><circle cx="214.3" cy="170.9" r="5" stroke="#b95128" fill="#fbe9dd" stroke-width="1.6"/><circle cx="150.0" cy="107.9" r="5" stroke="#b95128" fill="#fbe9dd" stroke-width="1.6"/><circle cx="189.7" cy="95.3" r="5" stroke="#b95128" fill="#fbe9dd" stroke-width="1.6"/><text x="150.0" y="290.0" font-size="11" fill="#5b6a70" text-anchor="middle">C₂₀ (dodecahedron), flattened: 12 pentagons</text><text x="150.0" y="305.0" font-size="11" fill="#b95128" text-anchor="middle">orange dot = one face (the 12th is the outside)</text><text x="330.0" y="40.0" font-size="12.5" fill="#192a31" text-anchor="start" font-weight="600" xml:space="preserve">From a fullerene to a spectrum</text><text x="330.0" y="60.0" font-size="11" fill="#192a31" text-anchor="start" xml:space="preserve"></text><text x="330.0" y="80.0" font-size="11.5" fill="#192a31" text-anchor="start" xml:space="preserve">1. Dual graph T₂₀: one vertex per face, an edge</text><text x="330.0" y="100.0" font-size="11.5" fill="#192a31" text-anchor="start" xml:space="preserve">   between faces that touch. Here: the icosahedron.</text><text x="330.0" y="120.0" font-size="11.5" fill="#192a31" text-anchor="start" xml:space="preserve">2. Spectrum = eigenvalues of its adjacency matrix:</text><text x="330.0" y="140.0" font-size="11.5" fill="#214fc5" text-anchor="start" font-weight="600" xml:space="preserve">   5, √5 (×3), −1 (×5), −√5 (×3).</text><text x="330.0" y="160.0" font-size="11.5" fill="#192a31" text-anchor="start" xml:space="preserve">3. Two different isomers with the same spectrum</text><text x="330.0" y="180.0" font-size="11.5" fill="#192a31" text-anchor="start" xml:space="preserve">   are “cospectral”: the spectrum cannot tell them</text><text x="330.0" y="200.0" font-size="11.5" fill="#192a31" text-anchor="start" xml:space="preserve">   apart. Smallest pair: C42:6 and C42:22.</text><text x="330.0" y="220.0" font-size="11" fill="#192a31" text-anchor="start" xml:space="preserve"></text><text x="330.0" y="240.0" font-size="11.5" fill="#214fc5" text-anchor="start" font-weight="600" xml:space="preserve">Result 22: infinite cospectral families for</text><text x="330.0" y="260.0" font-size="11.5" fill="#214fc5" text-anchor="start" font-weight="600" xml:space="preserve">n ≡ 2, 20 (mod 24), by rotating a nanotube cap.</text></svg>