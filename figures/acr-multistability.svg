<svg xmlns="http://www.w3.org/2000/svg" width="760" height="286" font-family="DM Sans, Helvetica Neue, Helvetica, Arial, sans-serif" viewBox="0 0 760 286" role="img" aria-label="Result 27: a combination of the equations forces x = 1 at every positive steady state, while two stable states coexist" font-size="12" fill="none" stroke-linecap="round" stroke-linejoin="round"><rect x="0.5" y="0.5" width="759.0" height="285.0" rx="8" fill="#fffefa" stroke="#dcded7"/><defs><marker id="aA" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#192a31"/></marker></defs><circle cx="18" cy="14" r="8" fill="#192a31"/><text x="18.0" y="18.0" font-size="10" fill="#fff" text-anchor="middle" font-weight="600">1</text><text x="32.0" y="18.0" font-size="12.5" fill="#192a31" text-anchor="start" font-weight="600">Why x is “robust”</text><text x="18.0" y="48.0" font-size="11.5" fill="#192a31" text-anchor="start">Network N1: Z → Y+Z, 2Z → Z, Y → Y+Z,</text><text x="18.0" y="66.0" font-size="11.5" fill="#192a31" text-anchor="start">Y+Z → 2X, X+Z → 2Z, 2X → Y</text><rect x="14.0" y="82.0" width="300.0" height="34.0" rx="5" stroke="#192a31" fill="#fffefa" stroke-width="1"/><text x="24.0" y="104.0" font-size="13" fill="#192a31" text-anchor="start" font-weight="600">ẋ + 2ẏ = z · (2κ₁ − κ₅ x)</text><text x="18.0" y="140.0" font-size="11" fill="#192a31" text-anchor="start">At a steady state the left side is zero.</text><text x="18.0" y="158.0" font-size="11" fill="#192a31" text-anchor="start">Since z > 0, x must equal 2κ₁/κ₅,</text><text x="18.0" y="176.0" font-size="11" fill="#192a31" text-anchor="start">whichever steady state is reached.</text><text x="18.0" y="202.0" font-size="11" fill="#214fc5" text-anchor="start" font-weight="600">κ = (5, 1, 1, 4, 10, 7): x = 2·5/10 = 1.</text><circle cx="378" cy="14" r="8" fill="#192a31"/><text x="378.0" y="18.0" font-size="10" fill="#fff" text-anchor="middle" font-weight="600">2</text><text x="392.0" y="18.0" font-size="12.5" fill="#192a31" text-anchor="start" font-weight="600">The 3 steady states (all with x = 1)</text><line x1="400.0" y1="240.0" x2="705.5" y2="240.0" stroke="#192a31" stroke-width="1" marker-end="url(#aA)"/><line x1="400.0" y1="240.0" x2="400.0" y2="25.0" stroke="#192a31" stroke-width="1" marker-end="url(#aA)"/><text x="700.0" y="261.0" font-size="11" fill="#5b6a70" text-anchor="end" font-style="italic">y</text><text x="392.0" y="35.0" font-size="11" fill="#5b6a70" text-anchor="end" font-style="italic">z</text><text x="454.5" y="255.0" font-size="10" fill="#5b6a70" text-anchor="middle">1</text><text x="509.1" y="255.0" font-size="10" fill="#5b6a70" text-anchor="middle">2</text><text x="563.6" y="255.0" font-size="10" fill="#5b6a70" text-anchor="middle">3</text><text x="618.2" y="255.0" font-size="10" fill="#5b6a70" text-anchor="middle">4</text><text x="672.7" y="255.0" font-size="10" fill="#5b6a70" text-anchor="middle">5</text><text x="393.0" y="194.0" font-size="10" fill="#5b6a70" text-anchor="end">1</text><text x="393.0" y="144.0" font-size="10" fill="#5b6a70" text-anchor="end">2</text><text x="393.0" y="94.0" font-size="10" fill="#5b6a70" text-anchor="end">3</text><text x="393.0" y="44.0" font-size="10" fill="#5b6a70" text-anchor="end">4</text><circle cx="659.1" cy="215.0" r="6" stroke="#214fc5" fill="#214fc5" stroke-width="1.6"/><text x="669.1" y="209.0" font-size="10.5" fill="#192a31" text-anchor="start">(1, 19/4, 1/2)</text><text x="669.1" y="223.0" font-size="10" fill="#214fc5" text-anchor="start" font-weight="600">stable</text><circle cx="563.6" cy="190.0" r="6" stroke="#192a31" fill="#fff" stroke-width="1.6"/><text x="573.6" y="184.0" font-size="10.5" fill="#192a31" text-anchor="start">(1, 3, 1)</text><text x="573.6" y="198.0" font-size="10" fill="#5b6a70" text-anchor="start">saddle</text><circle cx="495.5" cy="65.0" r="6" stroke="#214fc5" fill="#214fc5" stroke-width="1.6"/><text x="505.5" y="59.0" font-size="10.5" fill="#192a31" text-anchor="start">(1, 7/4, 7/2)</text><text x="505.5" y="73.0" font-size="10" fill="#214fc5" text-anchor="start" font-weight="600">stable</text><text x="370.0" y="274.0" font-size="10.5" fill="#5b6a70" text-anchor="start">Two stable states and a saddle: multistability with only 3 species.</text></svg>