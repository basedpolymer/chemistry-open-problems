<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="760" height="268" font-family="DM Sans, Helvetica Neue, Helvetica, Arial, sans-serif" viewBox="0 0 760 268" role="img" aria-label="The cycle C5 has Kirchhoff index 10, and so does the path left after deleting any vertex: all its vertices are good" font-size="12" fill="none" stroke-linecap="round" stroke-linejoin="round"><rect x="0.5" y="0.5" width="759.0" height="267.0" rx="8" fill="#fffefa" stroke="#dcded7"/><defs><marker id="kfA" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#214fc5"/></marker></defs><line x1="110.0" y1="58.0" x2="169.0" y2="100.8" stroke="#192a31" stroke-width="1.6"/><line x1="169.0" y1="100.8" x2="146.4" y2="170.2" stroke="#192a31" stroke-width="1.6"/><line x1="146.4" y1="170.2" x2="73.6" y2="170.2" stroke="#192a31" stroke-width="1.6"/><line x1="73.6" y1="170.2" x2="51.0" y2="100.8" stroke="#192a31" stroke-width="1.6"/><line x1="51.0" y1="100.8" x2="110.0" y2="58.0" stroke="#192a31" stroke-width="1.6"/><circle cx="110.0" cy="58.0" r="8" stroke="#b95128" fill="#fbe9dd" stroke-width="1.6"/><circle cx="169.0" cy="100.8" r="8" stroke="#214fc5" fill="#fffefa" stroke-width="1.6"/><circle cx="146.4" cy="170.2" r="8" stroke="#214fc5" fill="#fffefa" stroke-width="1.6"/><circle cx="73.6" cy="170.2" r="8" stroke="#214fc5" fill="#fffefa" stroke-width="1.6"/><circle cx="51.0" cy="100.8" r="8" stroke="#214fc5" fill="#fffefa" stroke-width="1.6"/><text x="110.0" y="26.0" font-size="11.5" fill="#192a31" text-anchor="middle" font-weight="600">C₅: every edge = 1 Ω</text><text x="110.0" y="214.0" font-size="10.5" fill="#192a31" text-anchor="middle">neighbours: 1·4/5 = 4/5 Ω (×5)</text><text x="110.0" y="230.0" font-size="10.5" fill="#192a31" text-anchor="middle">at distance 2: 2·3/5 = 6/5 Ω (×5)</text><text x="110.0" y="252.0" font-size="12.5" fill="#214fc5" text-anchor="middle" font-weight="700">Kf(C₅) = 4 + 6 = 10</text><line x1="220.0" y1="120.0" x2="320.0" y2="120.0" stroke="#214fc5" stroke-width="2" marker-end="url(#kfA)"/><text x="270.0" y="108.0" font-size="10.5" fill="#5b6a70" text-anchor="middle">delete a</text><text x="270.0" y="140.0" font-size="10.5" fill="#5b6a70" text-anchor="middle">vertex</text><line x1="360.0" y1="120.0" x2="420.0" y2="120.0" stroke="#192a31" stroke-width="1.6"/><line x1="420.0" y1="120.0" x2="480.0" y2="120.0" stroke="#192a31" stroke-width="1.6"/><line x1="480.0" y1="120.0" x2="540.0" y2="120.0" stroke="#192a31" stroke-width="1.6"/><circle cx="360.0" cy="120.0" r="8" stroke="#214fc5" fill="#fffefa" stroke-width="1.6"/><circle cx="420.0" cy="120.0" r="8" stroke="#214fc5" fill="#fffefa" stroke-width="1.6"/><circle cx="480.0" cy="120.0" r="8" stroke="#214fc5" fill="#fffefa" stroke-width="1.6"/><circle cx="540.0" cy="120.0" r="8" stroke="#214fc5" fill="#fffefa" stroke-width="1.6"/><text x="450.0" y="26.0" font-size="11.5" fill="#192a31" text-anchor="middle" font-weight="600">Path P₄</text><text x="450.0" y="214.0" font-size="10.5" fill="#192a31" text-anchor="middle">1+1+1 (neighbours) + 2+2 + 3</text><text x="450.0" y="252.0" font-size="12.5" fill="#214fc5" text-anchor="middle" font-weight="700">Kf(P₄) = 10</text><text x="590.0" y="40.0" font-size="10.5" fill="#192a31" text-anchor="start">Kf = sum of effective</text><text x="590.0" y="57.0" font-size="10.5" fill="#192a31" text-anchor="start">resistances between all</text><text x="590.0" y="74.0" font-size="10.5" fill="#192a31" text-anchor="start">pairs of vertices.</text><text x="590.0" y="91.0" font-size="10.5" fill="#192a31" text-anchor="start"></text><text x="590.0" y="108.0" font-size="10.5" fill="#192a31" text-anchor="start">A vertex is “good” if</text><text x="590.0" y="125.0" font-size="10.5" fill="#192a31" text-anchor="start">deleting it keeps Kf.</text><text x="590.0" y="142.0" font-size="10.5" fill="#192a31" text-anchor="start">In C₅, all 5 are good.</text><text x="590.0" y="159.0" font-size="10.5" fill="#214fc5" text-anchor="start"></text><text x="590.0" y="176.0" font-size="10.5" fill="#214fc5" text-anchor="start" font-weight="600">Result 21: are there</text><text x="590.0" y="193.0" font-size="10.5" fill="#214fc5" text-anchor="start" font-weight="600">others (100 % good)?</text><text x="590.0" y="210.0" font-size="10.5" fill="#214fc5" text-anchor="start" font-weight="600">Result 23: and with a</text><text x="590.0" y="227.0" font-size="10.5" fill="#214fc5" text-anchor="start" font-weight="600">fraction β of good ones?</text></svg>