.3 90.9 L198.4 89.7 L184.3 91.6 L171.8 95.7 L161.3 101.5 L152.8 108.1 L146.0 115.2 L140.8 122.5 L136.9 129.6 L134.0 136.5 L132.0 143.2 L130.7 149.6 L130.1 155.7 L130.0 161.6 L130.3 167.3 L131.1 172.7 L132.3 177.8 L133.8 182.8 L135.6 187.5 L137.7 192.0 L140.1 196.3 L142.8 200.4 L145.7 204.3 L148.9 207.9 L152.3 211.2 L155.8 214.4 L159.6 217.2 L163.5 219.8 L167.5 222.1 L171.7 224.1 L176.0 225.8 L180.3 227.2 L184.6 228.3 L189.0 229.2 L193.4 229.7 L197.7 230.0 L202.1 230.0 L206.3 229.7 L210.6 229.2 L214.7 228.5 L218.8 227.5 L222.8 226.2 L226.7 224.7 L230.6 223.0 L234.4 221.0 L238.1 218.8 L241.7 216.3 L245.2 213.5" stroke="#9db0e6" stroke-width="1" fill="none"/><line x1="288.8" y1="221.4" x2="291.7" y2="205.6" stroke="#214fc5" stroke-width="1" marker-end="url(#ciB)"/><circle cx="200.0" cy="160.0" r="70" stroke="#214fc5" fill="none" stroke-width="2.6"/><circle cx="178.5" cy="169.3" r="4" stroke="#192a31" fill="#fff" stroke-width="1.5"/><text x="180.5" y="187.3" font-size="10" fill="#192a31" text-anchor="middle">unstable</text><text x="180.5" y="199.3" font-size="10" fill="#192a31" text-anchor="middle">steady state</text><text x="204.0" y="80.5" font-size="12" fill="#214fc5" text-anchor="middle" font-weight="700">(x−2)² + (y−2)² = 1</text><text x="380.0" y="50.0" font-size="12.5" fill="#192a31" text-anchor="start" font-weight="600">What the certificate checks</text><text x="380.0" y="76.0" font-size="11" fill="#192a31" text-anchor="start" xml:space="preserve">1. The circle is invariant: on it, the</text><text x="380.0" y="93.0" font-size="11" fill="#192a31" text-anchor="start" xml:space="preserve">   derivative of (x−2)² + (y−2)² − 1 is</text><text x="380.0" y="110.0" font-size="11" fill="#192a31" text-anchor="start" xml:space="preserve">   an exact multiple of that polynomial.</text><text x="380.0" y="127.0" font-size="11" fill="#192a31" text-anchor="start" xml:space="preserve">2. No steady state on the circle: the</text><text x="380.0" y="144.0" font-size="11" fill="#192a31" text-anchor="start" xml:space="preserve">   angular speed stays > 0 on it.</text><text x="380.0" y="161.0" font-size="11" fill="#192a31" text-anchor="start" xml:space="preserve">3. Stability: ∮ div F dt = −3.684 751 929 3…</text><text x="380.0" y="178.0" font-size="11" fill="#192a31" text-anchor="start" xml:space="preserve">   (&lt; 0, rigorous integration).</text><text x="380.0" y="195.0" font-size="11" fill="#214fc5" text-anchor="start" xml:space="preserve"></text><text x="380.0" y="212.0" font-size="11" fill="#214fc5" text-anchor="start" font-weight="600" xml:space="preserve">Recomputed separately: zero remainder</text><text x="380.0" y="229.0" font-size="11" fill="#214fc5" text-anchor="start" font-weight="600" xml:space="preserve">(1) and integral −3.68475192932676 (3).</text></svg>