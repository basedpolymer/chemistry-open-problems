<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="760" height="300" font-family="DM Sans, Helvetica Neue, Helvetica, Arial, sans-serif" viewBox="0 0 760 300" role="img" aria-label="Idea of the lower bound: the Underwood flux splits the units into a light and a heavy side; the balance over the heavy side gives R at least every peak H_j" font-size="12" fill="none" stroke-linecap="round" stroke-linejoin="round"><rect x="0.5" y="0.5" width="759.0" height="299.0" rx="8" fill="#fffefa" stroke="#dcded7"/><defs><marker id="cA" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#192a31"/></marker><marker id="cO" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#b95128"/></marker><marker id="cB" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#214fc5"/></marker></defs><path d="M20 30 H300 C330 120 270 200 320 290 H20 Z" fill="#e4ebfb"/><path d="M300 30 H500 V290 H320 C270 200 330 120 300 30 Z" fill="#fbe9dd"/><path d="M300 30 C330 120 270 200 320 290" stroke="#192a31" stroke-width="1.4" stroke-dasharray="6 4"/><text x="34.0" y="52.0" font-size="12" fill="#214fc5" text-anchor="start" font-weight="600">light side: φ(θⱼ) &lt; 0</text><text x="486.0" y="52.0" font-size="12" fill="#b95128" text-anchor="end" font-weight="600">heavy side: φ(θⱼ) ≥ 0</text><rect x="50.0" y="72.0" width="60.0" height="36.0" rx="5" stroke="#192a31" fill="#fffefa" stroke-width="1.2"/><rect x="160.0" y="142.0" width="60.0" height="36.0" rx="5" stroke="#192a31" fill="#fffefa" stroke-width="1.2"/><rect x="350.0" y="92.0" width="60.0" height="36.0" rx="5" stroke="#192a31" fill="#fffefa" stroke-width="1.2"/><rect x="370.0" y="202.0" width="60.0" height="36.0" rx="5" stroke="#192a31" fill="#fffefa" stroke-width="1.2"/><rect x="80.0" y="217.0" width="60.0" height="36.0" rx="5" stroke="#192a31" fill="#fffefa" stroke-width="1.2"/><text x="80.0" y="94.0" font-size="10.5" fill="#192a31" text-anchor="middle">stage</text><text x="190.0" y="164.0" font-size="10.5" fill="#192a31" text-anchor="middle">stage</text><text x="380.0" y="114.0" font-size="10.5" fill="#192a31" text-anchor="middle">stage</text><text x="400.0" y="224.0" font-size="10.5" fill="#192a31" text-anchor="middle">reboiler</text><text x="110.0" y="239.0" font-size="10.5" fill="#192a31" text-anchor="middle">mixer</text><line x1="190.0" y1="290.0" x2="190.0" y2="180.0" stroke="#192a31" stroke-width="1.3" marker-end="url(#cA)"/><text x="198.0" y="282.0" font-size="10.5" fill="#192a31" text-anchor="start">feed: φ = 0</text><text x="198.0" y="268.0" font-size="10" fill="#5b6a70" text-anchor="start">(θⱼ is a feed root)</text><line x1="222.0" y1="150.0" x2="348.0" y2="116.0" stroke="#b95128" stroke-width="1.6" marker-end="url(#cO)"/><text x="276.0" y="122.0" font-size="11" fill="#b95128" text-anchor="middle" font-weight="700">|φ|</text><line x1="368.0" y1="202.0" x2="140.0" y2="225.0" stroke="#b95128" stroke-width="1.6" marker-end="url(#cO)"/><text x="258.0" y="205.0" font-size="11" fill="#b95128" text-anchor="middle" font-weight="700">|φ|</text><line x1="110.0" y1="216.0" x2="92.0" y2="110.0" stroke="#192a31" stroke-width="1.1" marker-end="url(#cA)"/><line x1="164.0" y1="160.0" x2="110.0" y2="110.0" stroke="#192a31" stroke-width="1.1" marker-end="url(#cA)"/><line x1="372.0" y1="128.0" x2="393.0" y2="200.0" stroke="#192a31" stroke-width="1.1" marker-end="url(#cA)"/><line x1="400.0" y1="278.0" x2="400.0" y2="240.0" stroke="#b95128" stroke-width="1.6" marker-end="url(#cO)"/><text x="408.0" y="272.0" font-size="11" fill="#b95128" text-anchor="start" font-weight="700">heat R</text><line x1="52.0" y1="82.0" x2="25.0" y2="60.0" stroke="#192a31" stroke-width="1.3" marker-end="url(#cA)"/><text x="28.0" y="80.0" font-size="12" fill="#192a31" text-anchor="end" font-weight="700">A</text><line x1="410.0" y1="92.0" x2="470.0" y2="70.0" stroke="#192a31" stroke-width="1.3" marker-end="url(#cA)"/><text x="474.0" y="70.0" font-size="12" fill="#192a31" text-anchor="start" font-weight="700">C</text><line x1="430.0" y1="220.0" x2="490.0" y2="240.0" stroke="#192a31" stroke-width="1.3" marker-end="url(#cA)"/><text x="494.0" y="244.0" font-size="12" fill="#192a31" text-anchor="start" font-weight="700">D</text><text x="470.0" y="96.0" font-size="10.5" fill="#b95128" text-anchor="start">φₚ > 0</text><text x="525.0" y="52.0" font-size="12.5" fill="#192a31" text-anchor="start" font-weight="600">The balance behind the proof</text><text x="525.0" y="78.0" font-size="11" fill="#192a31" text-anchor="start">1. Every unit conserves the Underwood</text><text x="525.0" y="94.0" font-size="11" fill="#192a31" text-anchor="start">   flux φ, up to its heat duty.</text><text x="525.0" y="110.0" font-size="11" fill="#192a31" text-anchor="start">2. All streams leaving a stage</text><text x="525.0" y="126.0" font-size="11" fill="#192a31" text-anchor="start">   have the same sign of φ.</text><text x="525.0" y="142.0" font-size="11" fill="#192a31" text-anchor="start">3. Add up the balances of the</text><text x="525.0" y="158.0" font-size="11" fill="#192a31" text-anchor="start">   heavy-side units:</text><rect x="521.0" y="170.0" width="232.0" height="58.0" rx="5" stroke="#192a31" fill="#fffefa" stroke-width="1"/><text x="529.0" y="187.0" font-size="10.5" fill="#192a31" text-anchor="start">R − Σ φₚ⁺ = (heat on light side)</text><text x="529.0" y="203.0" font-size="10.5" fill="#192a31" text-anchor="start"> + (cooling, heavy side) + Σ|φ| ≥ 0</text><text x="529.0" y="219.0" font-size="10.5" fill="#192a31" text-anchor="start">pure products: Σ φₚ⁺ = Hⱼ</text><text x="525.0" y="252.0" font-size="12" fill="#214fc5" text-anchor="start" font-weight="700">So R ≥ Hⱼ for every j,</text><text x="525.0" y="269.0" font-size="12" fill="#214fc5" text-anchor="start" font-weight="700">whatever the arrangement.</text></svg>