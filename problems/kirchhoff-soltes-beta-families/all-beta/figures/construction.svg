<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 300" width="760" height="300" font-family="Helvetica, Arial, sans-serif" font-size="14">
  <title>The graph: a clique with one hub per block, and a small graph W glued at one more clique vertex</title>
  <rect width="760" height="300" fill="#ffffff"/>
  <rect x="30" y="140" width="500" height="110" rx="26" fill="#eef2f7" stroke="#8a97a8"/>
  <text x="440" y="236" fill="#5c6a7c">clique K on ab+1 vertices</text>

  <!-- blocks -->
  <g stroke="#333333" stroke-width="1.3">
    <line x1="105" y1="62" x2="70" y2="185"/><line x1="105" y1="62" x2="105" y2="185"/><line x1="105" y1="62" x2="140" y2="185"/>
    <line x1="245" y1="62" x2="210" y2="185"/><line x1="245" y1="62" x2="245" y2="185"/><line x1="245" y1="62" x2="280" y2="185"/>
    <line x1="385" y1="62" x2="350" y2="185"/><line x1="385" y1="62" x2="385" y2="185"/><line x1="385" y1="62" x2="420" y2="185"/>
  </g>
  <g fill="none" stroke="#8a97a8">
    <rect x="52" y="168" width="106" height="34" rx="10"/>
    <rect x="192" y="168" width="106" height="34" rx="10"/>
    <rect x="332" y="168" width="106" height="34" rx="10"/>
  </g>
  <g fill="#1f5fbf">
    <circle cx="70" cy="185" r="7"/><circle cx="105" cy="185" r="7"/><circle cx="140" cy="185" r="7"/>
    <circle cx="210" cy="185" r="7"/><circle cx="245" cy="185" r="7"/><circle cx="280" cy="185" r="7"/>
    <circle cx="350" cy="185" r="7"/><circle cx="385" cy="185" r="7"/><circle cx="420" cy="185" r="7"/>
  </g>
  <g fill="#ffffff" stroke="#333333" stroke-width="1.5">
    <circle cx="105" cy="58" r="8"/><circle cx="245" cy="58" r="8"/><circle cx="385" cy="58" r="8"/>
  </g>
  <text x="130" y="48" fill="#333333">one hub per block</text>
  <text x="58" y="274" fill="#1f5fbf">a blocks of b vertices each: these are the good vertices</text>
  <text x="462" y="192" fill="#5c6a7c" font-size="20">...</text>

  <!-- root and W -->
  <rect x="507" y="176" width="16" height="16" fill="#ffffff" stroke="#b03a2e" stroke-width="2"/>
  <text x="498" y="168" fill="#b03a2e">w</text>
  <g stroke="#b03a2e" stroke-width="1.3" fill="#fbeeec">
    <path d="M515 184 L600 92 L662 142 Z"/>
    <path d="M515 184 L662 142 L602 202 Z"/>
    <path d="M600 92 L602 202" fill="none"/>
  </g>
  <g stroke="#b03a2e" stroke-width="1.3">
    <line x1="662" y1="142" x2="716" y2="108"/><line x1="662" y1="142" x2="722" y2="144"/>
    <line x1="515" y1="184" x2="590" y2="250"/><line x1="590" y1="250" x2="645" y2="250"/><line x1="645" y1="250" x2="700" y2="250"/>
  </g>
  <g fill="#b03a2e">
    <circle cx="600" cy="92" r="4.5"/><circle cx="662" cy="142" r="4.5"/><circle cx="602" cy="202" r="4.5"/>
    <circle cx="716" cy="108" r="4.5"/><circle cx="722" cy="144" r="4.5"/>
    <circle cx="590" cy="250" r="4.5"/><circle cx="645" cy="250" r="4.5"/><circle cx="700" cy="250" r="4.5"/>
  </g>
  <text x="560" y="72" fill="#b03a2e">W: cliques, leaves, a tree</text>
</svg>
